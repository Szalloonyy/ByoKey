# RecallDrop – XcodeGen project specification
#
#   brew install xcodegen
#   cd RecallDrop && xcodegen generate
#   open RecallDrop.xcodeproj
#
# Set DEVELOPMENT_TEAM and RD_BUNDLE_ID_PREFIX in Config/RecallDrop.xcconfig
# before running on a device.

name: RecallDrop

options:
  bundleIdPrefix: com.example.recalldrop
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/RecallDrop.xcconfig
  Release: Config/RecallDrop.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  RecallDropKit:
    path: Packages/RecallDropKit

fileGroups:
  - Config
  - README.md

targets:
  # MARK: iOS app
  RecallDrop-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RecallDropKit
      - target: RecallDropShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: RecallDrop
        PRODUCT_MODULE_NAME: RecallDrop
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Config/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS/RecallDrop.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  # MARK: iOS share extension
  RecallDropShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared/Models
      - path: Shared/Services
      - path: Shared/Components
      - path: Shared/Environment
      - path: ShareExtension
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RecallDropKit
    settings:
      base:
        PRODUCT_NAME: RecallDropShare
        PRODUCT_MODULE_NAME: RecallDropShare
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_ID_PREFIX).share
        INFOPLIST_FILE: Config/ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ShareExtension/RecallDropShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # MARK: macOS app (menu bar extra, Drop Shelf, global shortcuts)
  RecallDrop-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RecallDropKit
    settings:
      base:
        PRODUCT_NAME: RecallDrop
        PRODUCT_MODULE_NAME: RecallDrop
        PRODUCT_BUNDLE_IDENTIFIER: $(RD_BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Config/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS/RecallDrop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  RecallDrop-iOS:
    build:
      targets:
        RecallDrop-iOS: all
        RecallDropShare: all
    run:
      config: Debug
      executable: RecallDrop-iOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  RecallDropShare:
    build:
      targets:
        RecallDropShare: all
        RecallDrop-iOS: all
    run:
      config: Debug
      askForAppToLaunch: true
      debugEnabled: true
    archive:
      config: Release

  RecallDrop-macOS:
    build:
      targets:
        RecallDrop-macOS: all
    run:
      config: Debug
      executable: RecallDrop-macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
